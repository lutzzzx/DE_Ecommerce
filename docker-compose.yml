x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 8125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    KAFKA_BROKER: ${KAFKA_BROKER}
    DWH_HOST: postgres-dwh
    DWH_DB: ${POSTGRES_DWH_DB}
    DWH_USER: ${POSTGRES_DWH_USER}
    DWH_PASSWORD: ${POSTGRES_DWH_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./spark_jobs:/opt/spark_jobs
    - ./dbt:/opt/dbt
    - ./great_expectations:/opt/great_expectations
    - ./data:/opt/data
    - ./ingestion:/opt/ingestion
    - /var/run/docker.sock:/var/run/docker.sock
  group_add:
    - 0
  depends_on:
    - postgres-airflow
  networks: [dataplatform]

services:
  # ---------------- Object Storage (Data Lake) ----------------
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dataplatform]

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET_DATALAKE}/bronze &&
      mc mb -p local/${MINIO_BUCKET_DATALAKE}/silver &&
      mc mb -p local/${MINIO_BUCKET_DATALAKE}/gold &&
      exit 0
      "
    networks: [dataplatform]

  # ---------------- Kafka (KRaft mode, single node) ----------------
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      resources:
        limits:
          memory: 1024M
    networks: [dataplatform]

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on: [kafka]
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [dataplatform]

  # ---------------- Spark (minimal cluster) ----------------
  spark-master:
    build:
      context: ./docker/spark
    container_name: spark-master
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    environment:
      SPARK_MODE: master
    ports:
      - "8081:8080"   # Spark master UI
      - "7077:7077"
    volumes:
      - ./spark_jobs:/opt/spark_jobs
    deploy:
      resources:
        limits:
          memory: 1024M
    networks: [dataplatform]

  spark-worker:
    build:
      context: ./docker/spark
    container_name: spark-worker
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1536M
    depends_on: [spark-master]
    volumes:
      - ./spark_jobs:/opt/spark_jobs
    deploy:
      resources:
        limits:
          memory: 2048M
    networks: [dataplatform]

  # ---------------- Postgres: Data Warehouse ----------------
  postgres-dwh:
    image: postgres:15
    container_name: postgres-dwh
    environment:
      POSTGRES_DB: ${POSTGRES_DWH_DB}
      POSTGRES_USER: ${POSTGRES_DWH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DWH_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DWH_USER} -d ${POSTGRES_DWH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dataplatform]

  postgres-dwh-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-dwh-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_DWH_USER}:${POSTGRES_DWH_PASSWORD}@postgres-dwh:5432/${POSTGRES_DWH_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on: [postgres-dwh]
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [dataplatform]

  # ---------------- Postgres: Airflow metadata DB ----------------
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER} -d ${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [dataplatform]

  # ---------------- Airflow ----------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Data --lastname Engineer \
          --role Admin --email admin@example.com
    depends_on:
      postgres-airflow:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on: [airflow-init]
    deploy:
      resources:
        limits:
          memory: 1024M

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on: [airflow-init]
    deploy:
      resources:
        limits:
          memory: 1280M

  statsd-exporter:
    image: prom/statsd-exporter:latest
    container_name: statsd-exporter
    ports:
      - "9102:9102"
      - "8125:8125/udp"
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [dataplatform]

  # ---------------- BI ----------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: ${MB_DB_FILE}
      JAVA_OPTS: "-Xmx768m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      postgres-dwh:
        condition: service_healthy
    networks: [dataplatform]

  # ---------------- Monitoring ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [dataplatform]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on: [prometheus]
    networks: [dataplatform]

networks:
  dataplatform:
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  postgres_dwh_data:
  postgres_airflow_data:
  airflow_logs:
  metabase_data:
  prometheus_data:
  grafana_data:
