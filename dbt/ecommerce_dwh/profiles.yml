ecommerce_dwh:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DWH_HOST', 'postgres-dwh') }}"
      user: "{{ env_var('DWH_USER', 'dwh_user') }}"
      password: "{{ env_var('DWH_PASSWORD', 'dwh_pass123') }}"
      port: 5432
      dbname: "{{ env_var('DWH_DB', 'warehouse') }}"
      schema: analytics
      threads: 4
