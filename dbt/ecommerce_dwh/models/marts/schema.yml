version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: fact_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: gross_merchandise_value
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: fact_events
    columns:
      - name: event_id
        tests: [not_null, unique]
