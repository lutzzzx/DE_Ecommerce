version: 2
sources:
  - name: staging
    schema: staging
    tables:
      - name: orders
      - name: order_items
      - name: customers
      - name: products
      - name: payments
      - name: events

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
  - name: stg_order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: stg_products
    columns:
      - name: product_id
        tests: [not_null, unique]
