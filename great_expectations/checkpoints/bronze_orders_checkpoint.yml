name: bronze_orders_checkpoint
config_version: 1.0
class_name: Checkpoint
validations:
  - batch_request:
      datasource_name: minio_bronze_datasource
      data_connector_name: default_runtime_data_connector
      data_asset_name: bronze_orders
      runtime_parameters:
        query: "SELECT * FROM staging.orders LIMIT 100000"
      batch_identifiers:
        batch_id: bronze_orders_batch
    expectation_suite_name: bronze_orders_suite
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
