apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: WarehousePostgres
    type: postgres
    access: proxy
    url: postgres-dwh:5432
    database: warehouse
    user: dwh_user
    secureJsonData:
      password: dwh_pass123
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    editable: true
